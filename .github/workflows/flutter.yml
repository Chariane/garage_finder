name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux test dependencies
        run: sudo apt-get update && sudo apt-get install -y clang cmake libgtk-3-dev liblzma-dev libsqlite3-0 libsqlite3-dev ninja-build pkg-config xvfb
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Run integration tests on Linux desktop
        run: |
          flutter config --enable-linux-desktop
          xvfb-run -a flutter test integration_test/app_flow_test.dart -d linux --reporter expanded
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: garage-finder-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
