name: Flutter CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install SQLite development library
        run: sudo apt-get update && sudo apt-get install -y libsqlite3-0 libsqlite3-dev
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.3'
          channel: stable
          cache: true
      - run: flutter pub get
      - run: dart format --set-exit-if-changed lib test integration_test
      - run: flutter analyze
      - run: flutter test
      - name: Run integration tests on Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        timeout-minutes: 22
        env:
          ANDROID_EMULATOR_WAIT_TIME_BEFORE_KILL: 5
        with:
          api-level: 34
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: |
            set +e
            timeout --foreground --signal=INT --kill-after=15s 18m flutter test --verbose --reporter expanded integration_test/app_flow_test.dart
            test_status=$?
            if [ "$test_status" -ne 0 ]; then
              echo "Integration test failed or timed out; recent Android logs follow."
              adb logcat -d -t 500 -s flutter AndroidRuntime System.err ActivityTaskManager
            fi
            exit "$test_status"
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: garage-finder-demo-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
